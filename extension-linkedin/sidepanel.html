<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova · LinkedIn</title>
<style>
:root{--ink:#0A2540;--mut:#64748B;--line:#E4E7DD;--ok:#00804C;--warn:#B45309;--err:#B42318;--bg:#F6F7ED}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);padding:16px}
h1{font-size:16px;margin:0 0 4px}p{margin:0 0 12px;color:var(--mut);font-size:12.5px}
.card{background:#fff;border:1px solid var(--line);padding:12px;margin-bottom:12px}
label{display:block;font-weight:600;font-size:12.5px;margin-bottom:4px}input{width:100%;padding:8px;border:1px solid var(--line);font:inherit}
button{font:inherit;font-weight:600;padding:8px 12px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
button.pri{background:var(--ink);color:#fff}.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
.st{padding:10px;border-left:4px solid var(--mut);background:#fff;font-size:13px}.st.ok{border-color:var(--ok)}.st.warn{border-color:var(--warn)}.st.err{border-color:var(--err)}.st.work{border-color:#1E5FA8}
.pill{display:inline-block;padding:2px 8px;font-size:12px;font-weight:700;margin-bottom:8px}.pill.on{background:#EAF5EE;color:var(--ok)}.pill.off{background:#FFF7E6;color:var(--warn)}
small{color:var(--mut)}
</style></head><body>
<h1>Nova · LinkedIn</h1><p>Ejecuta en esta cuenta lo que Nova programa. Los topes y horarios los controla Nova.</p>
<div class="card"><span id="pill" class="pill off">En pausa</span>
<div id="st" class="st">Cargando…</div>
<div class="row"><button id="toggle" class="pri">Activar</button><button id="now">Comprobar ahora</button></div>
<p style="margin-top:10px"><small>Se detiene sola si LinkedIn muestra un aviso, y Nova pausa la cuenta 48 h.</small></p></div>
<div class="card"><label for="tok">Token de la cuenta (desde Nova)</label><input id="tok" type="password" placeholder="nvli_…" autocomplete="off">
<div class="row"><button id="save">Guardar token</button></div></div>
<script src="sidepanel.js"></script></body></html>
