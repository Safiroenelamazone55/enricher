<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLOW · Acceso</title>
<style>
@font-face{font-family:Inter;font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter-latin-wght-normal.woff2) format("woff2")}
:root{--ink:#213856;--mut:#577090;--blue:#316BFE;--blue-d:#2457D6;--err:#B42318}
html,body{margin:0;height:100%}
#login{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:14px;overflow:auto;background-color:#1B1D26;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='520' height='760' viewBox='0 0 520 760' fill='none' stroke='%23ffffff' stroke-opacity='.10' stroke-width='1'><path d='M-20 140 C 90 60 180 230 330 120 S 500 40 560 150'/><path d='M-20 330 C 120 250 210 420 360 300 S 520 250 560 330'/><path d='M-20 560 C 100 500 230 650 370 540 S 520 480 560 600'/><path d='M90 -10 C 60 120 160 220 120 380 S 40 600 110 780'/><path d='M410 -10 C 450 140 360 260 420 400 S 500 620 430 780'/><circle cx='120' cy='128' r='3' fill='%23ffffff' fill-opacity='.35' stroke='none'/><circle cx='360' cy='300' r='3' fill='%23ffffff' fill-opacity='.35' stroke='none'/><circle cx='120' cy='380' r='3' fill='%23ffffff' fill-opacity='.35' stroke='none'/><circle cx='420' cy='400' r='3' fill='%23ffffff' fill-opacity='.35' stroke='none'/><circle cx='370' cy='540' r='3' fill='%23ffffff' fill-opacity='.35' stroke='none'/></svg>");background-size:cover;background-position:center;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#login[hidden]{display:none}
#login .lcard{position:relative;background:#fff;border-radius:24px;width:100%;max-width:960px;min-height:calc(100vh - 28px);padding:30px 26px 22px;box-sizing:border-box;font-size:14px;line-height:20px;color:#213856;display:flex;flex-direction:column}
#login .lx{position:absolute;top:14px;right:14px;width:28px;height:28px;border:0;background:none;color:#98A1AC;font-size:22px;line-height:1;cursor:pointer;border-radius:8px}#login .lx:hover{background:#F1F3F6}
#login .llogo{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:600;color:#213856;letter-spacing:-.02em}#login .llogo img{width:32px;height:32px;border-radius:8px}
#login .lcol{width:100%;max-width:432px;margin:46px auto 0;flex:1;display:flex;flex-direction:column}
#login h1{margin:0;padding:0 0 16px;text-align:center;font-size:25px;line-height:32px;font-weight:600;color:#213856}
#login .lbtn{width:100%;height:32px;border:.75px solid rgba(31,41,55,.1);background:#fff;border-radius:10px;font:inherit;font-size:14px;font-weight:500;color:#1F2937;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:1px 8px;box-sizing:border-box;box-shadow:0 1px 1px rgba(31,41,55,.04)}#login .lbtn:hover{background:#F8F9FA}
#login .lbtn img{width:16px;height:16px;border-radius:4px}
#login .lsep{display:flex;align-items:center;gap:0;margin:26px 0 20px;height:12px}#login .lsep::before,#login .lsep::after{content:"";flex:1;height:1px;background:#E5E7EB}#login .lsep span{width:8px;height:8px;border:1px solid #98A1AC;border-radius:50%;margin:0 4px;flex:none}
#login label{display:block;margin:0 0 4px;font-size:14px;font-weight:400;color:#577090}
#login label.l2{margin-top:14px}
#login .lin{position:relative}#login input{width:100%;height:32px;border:.75px solid #E5E7EB;border-radius:10px;padding:0 34px 0 12px;font:inherit;font-size:14px;font-weight:400;color:#213856;background:#fff;box-sizing:border-box}#login input::placeholder{color:#98A1AC}#login input:focus{outline:0;border-color:#9DB6FF;box-shadow:0 0 0 3px rgba(49,107,254,.12)}
#login .leye{position:absolute;right:4px;top:2px;width:28px;height:28px;border:0;background:none;color:#577090;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}#login .leye svg{flex:none;width:16px;height:16px;display:block}
#login .lforgot{align-self:flex-start;height:32px;margin:0;padding:1px 8px;border:.75px solid transparent;border-radius:10px;background:none;font:inherit;font-size:14px;font-weight:500;color:#5A6472;cursor:pointer}#login .lforgot:hover{background:#F6F7F8}
#login .lgo{width:100%;height:32px;margin-top:16px;border:.75px solid transparent;border-radius:10px;font:inherit;font-size:14px;font-weight:500;background:#F6F7F8;color:#9CA3AF;cursor:not-allowed;padding:1px 8px}#login .lgo.on{background:var(--blue);color:#fff;cursor:pointer}
#login .lerr{min-height:20px;margin:8px 0 0;font-size:13px;color:var(--err);text-align:center}
#login .lfoot{margin:auto 0 0;padding-top:40px;text-align:center;font-size:14px;color:#213856}#login .lfoot a{color:#213856;cursor:pointer;text-decoration:underline}
</style></head><body>
<div id="login"><div class="lcard">
  <button class="lx" id="lg-x" type="button" title="Cerrar">×</button>
  <div class="llogo"><img src="icons/icon128.png" alt="">FLOW</div>
  <div class="lcol">
  <h1>¡Bienvenido de nuevo!</h1>
  <button class="lbtn" id="lg-google" type="button"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Iniciar sesión con Google</button>
  <button class="lbtn lb2" id="lg-ms" type="button"><svg width="18" height="18" viewBox="0 0 23 23"><path fill="#F25022" d="M1 1h10v10H1z"/><path fill="#7FBA00" d="M12 1h10v10H12z"/><path fill="#00A4EF" d="M1 12h10v10H1z"/><path fill="#FFB900" d="M12 12h10v10H12z"/></svg>Iniciar sesión con Microsoft</button>
  <button class="lbtn lb2" id="lg-sso" type="button"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.8-9.8M16 7l3 3M18 5l2 2"/></svg>Inicia sesión con tu organización (SSO)</button>
  <div class="lsep"><span></span></div>
  <form id="lg-form" autocomplete="off">
    <label for="lg-email">Dirección de email</label><div class="lin"><input id="lg-email" type="email" placeholder="example@company.com" autocomplete="username"></div>
    <label class="l2" for="lg-pass">Contraseña</label><div class="lin"><input id="lg-pass" type="password" autocomplete="current-password"><button class="leye" id="lg-eye" type="button" title="Mostrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <button class="lforgot" id="lg-forgot" type="button">¿Olvidaste la contraseña?</button>
    <button class="lgo" id="lg-go" type="submit" disabled>Inicia sesión</button>
    <p class="lerr" id="lg-err"></p>
  </form>
  <p class="lfoot">¿Aún no tienes cuenta? <a id="lg-crear">Solicitar acceso</a></p>
  </div>
</div></div>
<style>#login .lb2{margin-top:8px}#login .lbtn:first-of-type{margin-top:0}#login .lbtn svg{flex:none}</style>
<script src="login.js"></script></body></html>
